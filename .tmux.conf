# Setting up Vi mode
setw -g mode-keys vi

# reload config file easier
bind r source-file ~/.tmux.conf

# Set prefix to C-a{
set-option -g prefix C-a
unbind-key C-b
bind-key C-a send-prefix
#}

# Some easy key bindings
bind-key : command-prompt
bind-key r refresh-client
bind-key l clear-history

# Make window swapping easier
bind-key space next-window
bind-key bspace previous-window
bind-key enter next-layout

# Use v and s to split windows
bind-key v split-window -h
bind-key s split-window -v

# Use vim-like keys for splits 
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R



#fixing 256 colors
#set -g default-terminal screen-256color
set -g default-terminal "xterm-256color"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin '2kabhishek/tmux2k'
set -g @plugin 'Lasith-Niro/tmux-todo'
# Changing the look
#set -g @plugin 'dracula/tmux' 
set -g @tmux2k-left-plugins "session git uptime cwd tdo"
#
set -g @todo-key              "W"        # toggle keybind     (default: t)
set -g @todo-pane-width       "34"       # side pane width    (default: 34)
set -g @todo-pane-side        "left"   # right or left      (default: right)
set -g @todo-refresh-interval "2"        # refresh in seconds (default: 2)
set -g @todo-scope            "current"  # current, all, or follow (default: current)
#
bind m run-shell "playerctl play-pause"
